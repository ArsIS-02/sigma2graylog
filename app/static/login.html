<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icon-16.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#0f1420">

<title>Вход — sigma2graylog</title>
<style>
  :root{
    --bg:#0b1018; --panel:#141b2b; --panel2:#1b2438; --line:#2a3550;
    --text:#e2e9f8; --muted:#8794b3; --accent:#4f8cff; --accent2:#7b5cff;
    --err:#ff5f6d; --ok:#37d67a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(900px 600px at 15% -10%, #1d2b52 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 0%, #2a1f4d 0%, transparent 55%),
      radial-gradient(700px 600px at 50% 120%, #10243a 0%, transparent 60%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .wrap{width:100%;max-width:420px}
  .brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:22px}
  .mark{
    width:42px;height:42px;border-radius:12px;flex:0 0 auto;
    box-shadow:0 10px 30px -10px #4f8cffaa;display:block;
  }
  .brand h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.2px}
  .brand h1 span{color:var(--accent)}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)), var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:26px 24px;
    box-shadow:0 24px 60px -30px #000, inset 0 1px 0 rgba(255,255,255,.04);
  }
  .card h2{margin:0 0 4px;font-size:17px;font-weight:600}
  .card .sub{margin:0 0 20px;font-size:13px;color:var(--muted)}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.02em}
  .field{position:relative}
  input{
    width:100%;padding:11px 42px 11px 13px;border-radius:10px;
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    font:inherit;outline:none;transition:border-color .15s, box-shadow .15s;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
  input:disabled{opacity:.6}
  .eye{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:transparent;border:0;color:var(--muted);cursor:pointer;
    padding:6px 8px;border-radius:8px;font-size:15px;line-height:1;
  }
  .eye:hover{color:var(--text);background:rgba(255,255,255,.05)}
  button.submit{
    width:100%;margin-top:20px;padding:11px 16px;border:0;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font:inherit;font-weight:650;cursor:pointer;
    box-shadow:0 12px 26px -14px #4f8cffcc;transition:filter .15s, transform .05s;
  }
  button.submit:hover{filter:brightness(1.07)}
  button.submit:active{transform:translateY(1px)}
  button.submit:disabled{opacity:.65;cursor:progress}
  .msg{margin-top:14px;font-size:13px;border-radius:9px;padding:9px 12px;display:none}
  .msg.err{display:block;background:rgba(255,95,109,.1);border:1px solid rgba(255,95,109,.35);color:#ffb3b8}
  .msg.ok{display:block;background:rgba(55,214,122,.1);border:1px solid rgba(55,214,122,.35);color:#9ff0bf}
  .lang-switch{display:flex;border:1px solid #26324a;border-radius:8px;overflow:hidden;width:max-content}
  .lang-switch button{background:transparent;border:0;color:#8b9ac2;font-size:12px;font-weight:600;
    padding:5px 10px;cursor:pointer}
  .lang-switch button.active{background:#4f8cff;color:#fff}
  .foot{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
  .foot code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img class="mark" src="/static/icon-192.png" alt="sigma2graylog" width="42" height="42">
    <div>
      <h1>sigma<span>2</span>graylog</h1>
      <p>Sigma → детекты Graylog · v__VERSION__</p>
    </div>
  </div>

  <div class="card">
    <h2>Вход в систему</h2>
    <p class="sub">Введите учётные данные, выданные администратором.</p>

    <form id="form" autocomplete="on">
      <label for="u">Имя пользователя</label>
      <div class="field">
        <input id="u" name="username" type="text" autocomplete="username"
               spellcheck="false" required autofocus>
      </div>

      <label for="p">Пароль</label>
      <div class="field">
        <input id="p" name="password" type="password" autocomplete="current-password" required>
        <button class="eye" type="button" id="eye" title="Показать пароль" aria-label="Показать пароль">👁</button>
      </div>

      <div class="lang-switch" style="margin:0 0 12px">
        <button type="button" data-lang="ru" class="active">RU</button><button type="button" data-lang="en">EN</button>
      </div>
      <button class="submit" type="submit" id="go">Войти</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <div class="foot">Graylog 7.x · поля индексов проверяются вживую</div>
</div>

<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const go = document.getElementById('go');
const pw = document.getElementById('p');

document.getElementById('eye').onclick = () => {
  pw.type = pw.type === 'password' ? 'text' : 'password';
};

function show(text, kind) {
  msg.textContent = text;
  msg.className = 'msg ' + kind;
}

form.onsubmit = async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  go.disabled = true;
  go.textContent = 'Проверяю…';
  try {
    const r = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('u').value.trim(),
        password: pw.value,
      }),
    });
    if (r.ok) {
      show('Вход выполнен, перенаправляю…', 'ok');
      location.replace('/');
      return;
    }
    // Показываем статус и текст, даже если ответ не JSON (502 от прокси, 500 от сервера).
    let detail = 'Не удалось войти';
    const raw = await r.text().catch(() => '');
    try {
      const j = JSON.parse(raw);
      detail = j.detail || j.message || detail;
    } catch (_) {
      if (raw && raw.length < 200 && !raw.includes('<')) detail = raw.trim();
      else detail = 'HTTP ' + r.status + '. Возможно, сервис перезапускается — повторите через 10 секунд.';
    }
    show(detail, 'err');
    pw.select();
  } catch (err) {
    show('Сервер недоступен (' + err.message + '). Проверьте адрес и попробуйте ещё раз.', 'err');
  } finally {
    go.disabled = false;
    go.textContent = 'Войти';
  }
};
</script>
<script src="/js/i18n.js"></script>
</body>
</html>
