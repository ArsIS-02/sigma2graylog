# Podman: podman-compose -f podman-compose.yaml up -d
services:
  sigma2graylog:
    image: ${S2G_IMAGE:-localhost/sigma2graylog:latest}
    container_name: sigma2graylog
    ports:
      - "${S2G_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - s2g-data:/data:Z
    # Если данные лежат в хостовом каталоге и podman каждый раз выдаёт ему
    # новые MCS-категории (файлы в /data становятся нечитаемыми, приложение
    # пересоздаёт users.json и пароль «слетает») — используйте label=disable:
    #   security_opt:
    #     - label=disable
    restart: unless-stopped

volumes:
  s2g-data:
