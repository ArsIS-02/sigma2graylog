# Реверс-прокси с TLS. Положите в /etc/nginx/conf.d/sigma2graylog.conf
#
# HTTPS нужен не только «для галочки»: копирование в буфер обмена через
# navigator.clipboard работает только в защищённом контексте. На http://
# остаётся запасной путь через execCommand, но в HTTPS он надёжнее.

upstream s2g {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name sigma.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sigma.example.com;

    ssl_certificate     /etc/nginx/certs/sigma.crt;
    ssl_certificate_key /etc/nginx/certs/sigma.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # загрузка правил: до 300 файлов, суммарно до 64 МБ
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://s2g;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # прогон по истории и пакетная конвертация долгие
        proxy_send_timeout 300s;
    }
}
